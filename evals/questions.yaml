    expected: 40 euros for up to three items.
    key: 40 euroa
    fi: Paljonko vanhan sohvan nouto kotoa maksaa?
    en: How much does it cost to have an old sofa picked up from home?
    vi: Thuê người đến nhà lấy ghế sofa cũ tốn bao nhiêu?
  - id: q32
    pages: [terveysasema]
    expected: Contact the health centre by phone or chat; a nurse assesses and books the time.
    key: puhelimitse
    fi: Miten varaan ajan terveysasemalle?
    en: How do I book an appointment at the health centre?
    vi: Làm sao để đặt lịch khám ở trạm y tế?
  - id: q33
    pages: [terveysasema]
    expected: 20.90 euros for an adult; free under 18.
    key: "20,90"
    fi: Paljonko lääkärikäynti terveysasemalla maksaa?
    en: How much does a doctor's visit at the health centre cost?
    vi: Khám bác sĩ ở trạm y tế tốn bao nhiêu tiền?
  - id: q34
