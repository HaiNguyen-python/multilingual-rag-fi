    vi: Tôi gọi số nào khi cần chăm sóc khẩn cấp nhưng không nguy hiểm đến tính mạng?
  - id: q35
    pages: [hammashoito]
    expected: Call dental appointments first thing in the morning.
    key: aamulla
    fi: Mitä teen, jos minulla on kova hammassärky?
    en: What should I do if I have a bad toothache?
    vi: Tôi phải làm gì nếu bị đau răng dữ dội?
  - id: q36
    pages: [tyovaenopisto]
    expected: Yes, a 50 per cent discount.
    key: "50"
    fi: Saako työtön alennusta kurssimaksusta?
    en: Do unemployed people get a discount on course fees?
    vi: Người thất nghiệp có được giảm học phí khóa học không?
  - id: q37
    pages: [suomen-kurssit]
    expected: Some courses prepare for the YKI test; register for the test separately.
    key: YKI
    fi: Valmentavatko kurssit YKI-testiin?
    en: Do the courses prepare me for the YKI test?
    vi: Các khóa học có luyện thi YKI không?
  - id: q38
    pages: [uimahalli]
    expected: 6.50 euros.
    key: "6,50"
    fi: Paljonko aikuisen lippu uimahalliin maksaa?
    en: How much is an adult ticket to the swimming hall?
    vi: Vé bơi cho người lớn giá bao nhiêu?
  - id: q39
    pages: [verokortti]
    expected: The employer withholds 60 per cent tax.
    key: "60"
    fi: Mitä tapahtuu, jos en anna verokorttia työnantajalle?
    en: What happens if I don't give my tax card to my employer?
    vi: Điều gì xảy ra nếu tôi không nộp thẻ thuế cho chủ lao động?
  - id: q40
    pages: [muutosverokortti]
    expected: When your income changes during the year.
    key: tulosi
