[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrag"
version = "0.1.0"
description = "Multilingual RAG over Finnish public-service pages: ask in Finnish, English or Vietnamese, get a cited answer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "snowballstemmer>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
neural = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7",
  "matplotlib>=3.8", "types-PyYAML>=6.0",
]

[project.scripts]
mlrag = "mlrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlrag = ["glossary.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mlrag --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.run]
source = ["mlrag"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
