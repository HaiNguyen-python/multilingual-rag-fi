# Small bilingual glossary used by the offline translator (a stand-in for a real MT model).
#
# Keys are English or Vietnamese words/phrases (lowercase). Values are Finnish base forms; the
# Finnish analyser stems them, so "kortti" also matches "kortin" and "kortilla". A value may hold
# several Finnish words. The longest matching phrase wins, so "library card" beats "card".
# Stopwords are dropped (they carry no retrieval signal).
#
# Written from the vocabulary of the corpus pages, before the evaluation questions were run,
# and not tuned afterwards to fix misses. See docs/decisions.md.

stopwords:
  en: [a, an, and, are, as, at, be, by, can, could, do, does, did, for, from, get, got, how,
       i, if, in, is, it, me, my, of, "on", or, should, that, the, this, to, was, what, when,
       where, which, who, why, will, with, you, your, much, many, long, there, have, has,
       need, must, am, any, anything, there, they, their, our, we, about, after, before,
       happens, happen, someone, something, way, which, s, t, don, doesn]
  vi: [tôi, của, là, có, không, được, có được, thì, mà, và, hay, hoặc, ở, ở đâu, đâu,
       khi nào, bao giờ, bao lâu, bao nhiêu, như thế nào, thế nào, làm sao, làm sao để,
       làm gì, gì, nào, cho, với, các, những, một, để, này, đó, cần, phải, nên, vào, trong,
       nếu, bị, đi, ạ, mình, người, có thể, thể, từ, lên, đến, lại, mấy, điều gì, xảy ra,
       khi, sao, ai, thế, nhé, vậy, muốn, hãy, về, sau, trước, mang]

